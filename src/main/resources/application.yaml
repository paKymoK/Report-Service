server:
  port: 8080
spring:
  main:
    web-application-type: reactive
  application:
    name: report
  data:
    redis:
      port: 6379
      host: 127.0.0.1
  jackson:
    serialization:
      write-dates-as-timestamps: false
  config:
    import:
      - 'classpath:config/liquibase.yml'
      - 'classpath:config/r2dbc.yml'
      - 'classpath:config/oauth2.yml'
      - 'classpath:config/eureka-client.yml'
      - 'classpath:config/springdoc.yml'
      - 'classpath:config/debezium.yml'
  logging:
    level:
      root: INFO
      org.springframework.web: INFO
      org.springframework.security: INFO
      org.springframework.security.oauth2: DEBUG
